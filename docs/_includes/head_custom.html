<link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
<meta name="theme-color" content="#842a00">
<meta name="color-scheme" content="light dark">
{% if page.url == "/404.html" %}<meta name="robots" content="noindex">{% endif %}
<script>
  // Apply the saved (or system) colour mode before the page paints, to avoid a light flash in dark mode.
  (function () {
    try {
      var mode = localStorage.getItem("messengerr-mode") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-mode", mode);
      if (mode === "dark") {
        var link = document.querySelector('link[rel="stylesheet"]');
        link.setAttribute("href", link.getAttribute("href").replace("just-the-docs-default.css", "just-the-docs-messengerr-dark.css"));
      }
    } catch (e) {}
  })();
</script>
